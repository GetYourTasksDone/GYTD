name: Dev CI/CD Pipeline

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  # ======================
  # CI: Build + Test
  # ======================
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run basic import test
        run: |
          python -c "import app"

      - name: Build Docker Image (local check only)
        run: |
          docker build -t getdone-backend:dev ./backend

  # ======================
  # CD: Deploy via SSH
  # ======================
  deploy:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          source: "backend"
          target: "/root/gytd"

      - name: Deploy on remote Docker server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}

          script: |
            echo "Deploying application..."

            cd /root/gytd/backend

            docker stop getdone-app || true
            docker rm getdone-app || true

            docker build -t getdone-backend .

            docker run -d \
              --name getdone-app \
              --restart always \
              -p 80:5000 \
              getdone-backend

            docker ps

            echo "Deployment successful"
