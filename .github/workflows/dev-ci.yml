name: Dev CI Pipeline

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Pull the code from GitHub into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Python (to run a quick syntax check)
      - name: Set up Python
        uses: actions/checkout@v4
        with:
          python-version: '3.11'

      # Build the Docker Image
      # This mimics what you did locally: 'docker build'
      - name: Build Docker Image
        run: |
          docker build -t getdone-backend:dev ./backend

      # Verify Docker Image exists
      - name: Docker Image Check
        run: docker images | grep getdone-backend
