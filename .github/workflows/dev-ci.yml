name: Dev CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read
  packages: write

jobs:
  # PHASE 1: CI (Continuous Integration)
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # CI Step: Python Check
      - name: Set up Python
        uses: actions/setup-python@v5 # Note: corrected from actions/checkout
        with:
          python-version: '3.11'

      # CI Step: Build local image for testing
      - name: Build Docker Image
        run: |
          docker build -t getdone-backend:dev ./backend

      # CI Step: Verification
      - name: Docker Image Check
        run: docker images | grep getdone-backend

      # CI/CD Bridge: Login and Push to GHCR
      # This step only runs if the 'push' event happened (not for PRs)
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:dev
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

  # PHASE 2: CD (Continuous Deployment)
  deploy:
    # This ensures deployment only happens on 'push' to dev, not just a PR
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Login to GHCR on the server
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Update the container
            docker pull ghcr.io/${{ github.repository }}/backend:dev
            docker stop getdone-app || true
            docker rm getdone-app || true
            docker run -d \
              --name getdone-app \
              --restart always \
              -p 80:5000 \
              ghcr.io/${{ github.repository }}/backend:dev
