name: Dev CI/CD Pipeline

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

permissions:
  contents: read
  packages: write

jobs:
  # PHASE 1: CI (Continuous Integration)
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # CI Step: Python Check
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CI Step: Build local image for testing
      - name: Build Docker Image
        run: |
          docker build -t getdone-backend:dev ./backend

      # CI Step: Verification
      - name: Docker Image Check
        run: docker images | grep getdone-backend

      # CI/CD Bridge: Login and Push to GHCR
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:dev
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

  # PHASE 2: CD (Continuous Deployment)
deploy:
  if: github.event_name == 'push'
  needs: build-and-test
  runs-on: ubuntu-latest

  steps:
    # STEP 1: Checkout latest code from GitHub runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # STEP 2: Copy project files to remote Docker server
    - name: Copy project files to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        password: ${{ secrets.REMOTE_PASSWORD }}
        port: ${{ secrets.REMOTE_PORT }}
        source: "./backend"
        target: "/root/gytd"

    # STEP 3: SSH into remote server and deploy
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        password: ${{ secrets.REMOTE_PASSWORD }}
        port: ${{ secrets.REMOTE_PORT }}

        script: |
          echo "Connected to local Docker production server!"

          # Navigate to copied backend folder
          cd /root/gytd/backend

          # Stop old container
          docker stop getdone-app || true
          docker rm getdone-app || true

          # Remove old image
          docker rmi getdone-backend || true

          # Build latest image directly on server
          docker build -t getdone-backend .

          # Run latest container
          docker run -d \
            --name getdone-app \
            --restart always \
            -p 80:5000 \
            getdone-backend

          # Verify deployment
          docker ps

          echo "Deployment complete."
