name: Dev CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read
  packages: write

jobs:
  # PHASE 1: CI (Continuous Integration)
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # CI Step: Python Check
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CI Step: Build local image for testing
      - name: Build Docker Image
        run: |
          docker build -t getdone-backend:dev ./backend

      # CI Step: Verification
      - name: Docker Image Check
        run: docker images | grep getdone-backend

      # CI/CD Bridge: Login and Push to GHCR
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:dev
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

  # PHASE 2: CD (Continuous Deployment)
  deploy:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH (ngrok tunnel)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }} # Uses the dynamic ngrok port
          script: |
            echo "Successfully connected to the local Docker Server via ngrok!"
            
            # 1. Login to GHCR on your local machine container
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Update the container
            docker pull ghcr.io/${{ github.repository }}/backend:dev
            
            docker stop getdone-app || true
            docker rm getdone-app || true
            
            # 3. Run the container
            # We map port 80 of the "server" container to port 5000 of the Flask app
            docker run -d \
              --name getdone-app \
              --restart always \
              -p 80:5000 \
              ghcr.io/${{ github.repository }}/backend:dev
